- topic: zigbee2mqtt/example device
  payload: '{"current":0.54,"energy":1.05,"identify":null,"linkquality":255,"power":102,"power_on_behavior":"on","state":"ON","update":{"installed_version":33816645,"latest_version":33816645,"state":"idle"},"voltage":239.1}'
  expect:
    - 'zigbee_power_meter_current{device="example device"} 0.54'
    - 'zigbee_power_meter_energy_total{device="example device"} 1.05'
    - 'zigbee_power_meter_power{device="example device"} 102'
    - 'zigbee_power_meter_voltage{device="example device"} 239.1'
    - 'zigbee_link_quality{device="example device"} 255'
    - 'zigbee_state{device="example device"} 1'

- topic: zigbee2mqtt/partial device
  payload: '{"current":22222.0}'
  expect:
    - 'zigbee_power_meter_current{device="partial device"} 22222'
  reject:
    - 'zigbee_power_meter_power{device="partial device"}'

# $SYS topics are published by the broker itself; a client is not allowed to
# write them. These assert the series appears, not a value we chose.
- topic: $SYS/broker/uptime
  broker_generated: true
  expect:
    - mosquitto_uptime_seconds

- topic: $SYS/broker/clients/connected
  broker_generated: true
  expect:
    - 'mosquitto_clients{state="connected"}'

- topic: $SYS/broker/clients/disconnected
  broker_generated: true
  expect:
    - 'mosquitto_clients{state="disconnected"}'

- topic: $SYS/broker/clients/total
  broker_generated: true
  expect:
    - 'mosquitto_clients{state="total"}'

- topic: $SYS/broker/clients/maximum
  broker_generated: true
  expect:
    - 'mosquitto_clients{state="maximum"}'

- topic: $SYS/broker/subscriptions/count
  broker_generated: true
  expect:
    - mosquitto_subscriptions

- topic: $SYS/broker/retained messages/count
  broker_generated: true
  expect:
    - mosquitto_retained_messages

- topic: $SYS/broker/store/messages/count
  broker_generated: true
  expect:
    - mosquitto_store_messages

- topic: $SYS/broker/store/messages/bytes
  broker_generated: true
  expect:
    - mosquitto_store_bytes

- topic: $SYS/broker/messages/received
  broker_generated: true
  expect:
    - 'mosquitto_messages_total{direction="received"}'

- topic: $SYS/broker/messages/sent
  broker_generated: true
  expect:
    - 'mosquitto_messages_total{direction="sent"}'

- topic: $SYS/broker/bytes/received
  broker_generated: true
  expect:
    - 'mosquitto_bytes_total{direction="received"}'

- topic: $SYS/broker/bytes/sent
  broker_generated: true
  expect:
    - 'mosquitto_bytes_total{direction="sent"}'

- topic: $SYS/broker/publish/messages/received
  broker_generated: true
  expect:
    - 'mosquitto_publish_messages_total{direction="received"}'

- topic: $SYS/broker/publish/messages/sent
  broker_generated: true
  expect:
    - 'mosquitto_publish_messages_total{direction="sent"}'

- topic: $SYS/broker/publish/messages/dropped
  broker_generated: true
  expect:
    - mosquitto_publish_messages_dropped_total

- topic: $SYS/broker/load/messages/received/1min
  broker_generated: true
  reject:
    - load_messages

- topic: $SYS/broker/version
  broker_generated: true
  reject:
    - mosquitto_version

