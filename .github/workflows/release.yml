name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: work out the next version
        id: version
        run: |
          git fetch --tags --force
          highest=$(git tag --list 'v[0-9]*' | sed 's/^v//' | sort -n | tail -1)
          echo "tag=v$(( ${highest:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: tag the release
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/slakje-nl/mqtt2prometheus:${{ steps.version.outputs.tag }}
            ghcr.io/slakje-nl/mqtt2prometheus:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
