version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - nilerr
    - revive
    - unconvert
    - usetesting
    - wastedassign
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
