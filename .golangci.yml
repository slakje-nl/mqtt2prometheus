version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - nilerr
    - revive
    - unconvert
    - usetesting
    - wastedassign
  settings:
    revive:
      rules:
        # CLAUDE.md forbids doc comments that only restate an identifier's name, which is what
        # this rule demands on every exported symbol. The two cannot both hold; the project rule
        # wins. This is the only disabled rule in the repository.
        - name: exported
          disabled: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
